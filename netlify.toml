[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCHBaxyAobC7cGn6YRAkY4ZfHY0gxdXZWg"
  SECRETS_SCAN_ENABLED = "false"

# Redireciona e protege arquivos sensíveis
[[redirects]]
  from = "/server.*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.map"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

# Proxy reverso de alta performance para o Backend (Render)
# Roteia chamadas /api/* para a API de inteligência e Telegram no Render
[[redirects]]
  from = "/api/*"
  to = "https://shazam-ygad.onrender.com/api/:splat"
  status = 200
  force = true

# Proxy de WebSockets para o Socket.io no Render
[[redirects]]
  from = "/socket.io/*"
  to = "https://shazam-ygad.onrender.com/socket.io/:splat"
  status = 200
  force = true

# SPA Fallback padrão
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.run.app wss://*.run.app https://*.onrender.com wss://*.onrender.com https://maps.googleapis.com https://updepix.cc; frame-src 'self' https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
