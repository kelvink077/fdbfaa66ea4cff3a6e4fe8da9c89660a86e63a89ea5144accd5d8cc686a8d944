# Netlify Deployment Configuration for IntelSaaS Frontend

[build]
  # Build production assets using Vite
  command = "npm run build"
  # Publish directory containing the compiled static frontend
  publish = "dist"

# Single Page Application (SPA) Routing Rule:
# Redirect all frontend paths to index.html with a 200 HTTP status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/socket.io/*"
  to = "https://shazam-ygad.onrender.com/socket.io/*"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://shazam-ygad.onrender.com/api/*"
  status = 200
  force = true

# Security & Cache Headers for production delivery
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
